- title: "Perception Before Reasoning: Dynamic Latent Reasoning for Video Understanding and Question Answering"
  authors: "Haotian Xia, Zilin Xiao, Junbo Zou, Vicente Ordonez, Hanjie Chen"
  venue: "arXiv preprint, 2026"
  tag: "Preprint"
  group: preprint
  selected: true
  teaser: "pubs/dylar.jpg"
  blurb: "DyLaR grounds a question in a short set of perception latents, then decides whether reasoning latents are needed. It improves accuracy on video benchmarks while generating fewer than 20 tokens per query."
  links:
    - {label: "arXiv", url: "https://arxiv.org/abs/2608.04124"}

